fine_tune_params:
  batch_size: 4
  epochs: 50
  iteration: 100
  learning_rate: 1e-5
  weight_decay: 4e-5
  trainable_image_encoder: false
  trainable_mask_decoder: true
  trainable_prompt_encoder: true

model:
  checkpoint: "kaggle/working/SA307sam2_hiera_large.pt" #path to the checkpoint
  config : "configs/sam2/sam2_hiera_l.yaml" #  path to the model config
  device: cuda

fine_tune_path:
  train_dir: "/path/to/train"
  train_dir_mask: "/path/to/train/mask"
  ckpt_dir: "/path/to/checkpoint"

testing:
  test_dir: "/path/to/test"
  test_dir_mask: "/path/to/test/mask"
  test_dir_output: "/path/to/output"

datasets:
  annotatation_coco: "/path/to/annotations"
